[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastertool-bridge"
version = "0.1.0"
description = "Ponte somente leitura entre MasterTool IEC XE 3.63 e ferramentas Python/Git/IA"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rankine Systems" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  # Excecao deliberada a disciplina de "zero dependencia nova" seguida em
  # todo o resto do indexer: um servidor MCP de verdade requer o SDK
  # oficial do Model Context Protocol (API de alto nivel FastMCP);
  # implementar o protocolo (JSON-RPC sobre stdio, handshake de
  # capacidades, etc.) a mao seria descabido. Ver mcp_server.py.
  #
  # O teto `<2` NAO e precaucao: foi medido. `mcp>=1.0` resolve hoje para
  # 2.0.0, que REMOVEU `mcp.server.fastmcp` -- exatamente o modulo importado
  # em `mcp_server.py:185`. Um ambiente montado a partir do manifesto antigo
  # sobe o servidor e morre em ModuleNotFoundError, e os sete testes E2E
  # falham por dependencia, nao por defeito. Migrar para a API 2.x e slice
  # funcional proprio; enquanto o codigo usa FastMCP 1.x, o manifesto tem de
  # dizer 1.x.
  "mcp>=1.0,<2",
]

[project.scripts]
mastertool-bridge = "mastertool_bridge.cli:main"
mastertool-bridge-mcp = "mastertool_bridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mastertool_bridge = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
