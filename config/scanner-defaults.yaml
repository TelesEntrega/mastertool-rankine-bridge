# Limites e escopo padrão do ReadOnlyProjectScanner
# (scripts/mastertool/common/read_only_project_scanner.py).
#
# Estes valores são GENÉRICOS — não específicos de nenhum projeto. O único
# valor específico de ExemploPlanta V1.0.project (expected_root_count: 4) é
# passado explicitamente pelo script de validação
# (probes/12_validate_recursive_scanner.py), nunca fixado aqui.
#
# Ver docs/11-read-only-project-scanner.md para a especificação completa.

scanner:
  max_depth: 8
  max_total_nodes: 5000
  max_children_per_node: 256
  expected_root_count: null

  read_name: true
  read_is_folder: true
  read_type_guid: true
  read_object_guid: true

  read_text_documents: false
  use_find: false
  use_active_application: false
  follow_references: false

  continue_on_field_error: true
  continue_on_child_error: true
  abort_on_collection_error: false

# Limites mais conservadores usados na PRIMEIRA execução real de validação
# (probes/12_validate_recursive_scanner.py) — não o padrão genérico acima.
first_validation_run:
  max_depth: 6
  max_total_nodes: 2000
  max_children_per_node: 128
  expected_root_count: 4  # específico de ExemploPlanta V1.0.project
