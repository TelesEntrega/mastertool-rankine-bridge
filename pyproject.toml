[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastertool-bridge"
version = "0.2.0a1"
description = "Ponte offline entre MasterTool (IEC XE 3.63/3.70 e MasterTool X 4.1) e Python 3: extracao, indexacao IEC 61131-3, consultas deterministicas, servidor MCP e autoria controlada de projeto sob aprovacao humana"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rankine Systems" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  # Excecao deliberada a disciplina de "zero dependencia nova" seguida em
  # todo o resto do indexer: um servidor MCP de verdade requer o SDK
  # oficial do Model Context Protocol (API de alto nivel FastMCP);
  # implementar o protocolo (JSON-RPC sobre stdio, handshake de
  # capacidades, etc.) a mao seria descabido. Ver mcp_server.py.
  #
  # O teto `<2` NAO e precaucao: foi medido. `mcp>=1.0` resolve hoje para
  # 2.0.0, que REMOVEU `mcp.server.fastmcp` -- exatamente o modulo importado
  # em `mcp_server.py:185`. Um ambiente montado a partir do manifesto antigo
  # sobe o servidor e morre em ModuleNotFoundError, e os sete testes E2E
  # falham por dependencia, nao por defeito. Migrar para a API 2.x e slice
  # funcional proprio; enquanto o codigo usa FastMCP 1.x, o manifesto tem de
  # dizer 1.x.
  "mcp>=1.0,<2",
]

[project.scripts]
mastertool-bridge = "mastertool_bridge.cli:main"
mastertool-bridge-mcp = "mastertool_bridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `contract/` E O CONTRATO ENTRE AS DUAS ARVORES, e por isso ele PRECISA
# viajar com o pacote.
#
# O roadmap pedia `operational-contract/` no topo do repositorio. Um diretorio
# de topo NAO entra na wheel: `pip install mastertool-bridge` receberia um
# nucleo que nao consegue validar o proprio contrato, e um contrato que so
# existe em checkout nao e honrado por um core instalado. Dai ele ser
# subdiretorio do pacote -- desvio de layout com motivo, nao por gosto.
#
# ACHADO no caminho: `planner/authoring_plan.schema.json` e
# `attestation/capability_attestation.schema.json` NUNCA foram empacotados.
# Sao dois schemas que o codigo carrega por caminho e que sumiam na instalacao.
mastertool_bridge = ["schemas/*.json", "contract/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
# Escopo DECLARADO, e estreito de proposito: so a biblioteca CPython 3.
#
# `scripts/mastertool/` roda em IronPython 2.7 DENTRO do MasterTool. Parte
# desses modulos e importada pelos testes por `importlib` para verificacao
# estatica (AST, vocabulario, precondicao), o que produziria um numero de
# cobertura real para linhas que nunca executam fora do produto -- e um
# percentual global misturando as duas camadas descreveria mal as duas. A
# cobertura desses arquivos e medida por outro meio (teste de AST, dublagem de
# API e execucao de campo), e entra no relatorio como categoria propria, nao
# como porcentagem somada a esta.
source = ["mastertool_bridge"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Sem `fail_under`. A fase P0.2 mede a baseline; impor limiar antes de saber o
# numero seria escolher a meta pela expectativa em vez de pela medicao.
